<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
<title id="title">企業系統邏輯架構圖</title><desc id="desc">前端使用者透過 API Gateway 連接 Report、Surrounding、Permission、Member 和 Bonus 模組，並存取資料庫及既有外部系統。</desc>
